services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    networks:
      - app_net
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web-old:
    build:
      context: ./web/app-old
    restart: unless-stopped
    networks:
      - app_net
    environment:
      PB_URL: http://pocketbase:8090
      PB_PUBLIC_URL: http://pocketbase:8090
      PORT: "8080"
      RELOAD: "0"
      DATA_API_URL: http://data-api:8070
    depends_on:
      pocketbase:
        condition: service_healthy
      data-api:
        condition: service_healthy

  web-api:
    build:
      context: ./api/web-api
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "8081:8081"
    environment:
      PB_URL: http://pocketbase:8090
      PORT: "8081"
      DATA_API_URL: http://data-api:8070
    depends_on:
      pocketbase:
        condition: service_healthy
      data-api:
        condition: service_healthy

  web:
    build:
      context: ./web/app
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WEB_API_INTERNAL_URL: http://web-api:8081
    depends_on:
      - web-api

  data-api:
    build:
      context: ./api/data-api
    restart: unless-stopped
    networks:
      - app_net
    environment:
      # NASA Earthdata Login (free: https://urs.earthdata.nasa.gov). Put them in ./.env (gitignored).
      # The account must also approve the "NASA GESDISC DATA ARCHIVE" application (for IMERG rainfall).
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
    volumes:
      - data_api_cache:/cache

networks:
  app_net:
    driver: bridge

volumes:
  data_api_cache:
